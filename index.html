<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GEHENNA - 프로젝트 참여 페이지</title>
<style>
    /* 네오둥근모 폰트 불러오기 */
    @font-face {
        font-family: 'NeoDunggeunmo';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');
        font-weight: normal;
        font-style: normal;
    }

    /* 💡 모든 요소의 테두리를 안쪽으로 계산하여 삐져나감 방지 */
    * {
        box-sizing: border-box;
    }

    /* 💡 화면 자체를 못 움직이게 압정으로 콱 박아버림 (모바일 튕김 완벽 차단) */
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: #fff;
        font-family: 'NeoDunggeunmo', sans-serif;
        overflow: hidden; 
        position: fixed; 
    }

    /* 상단 고정 내비게이션 바 */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        border-bottom: 2px solid #fff;
        background-color: rgba(0, 0, 0, 0.8);
        display: flex;
        z-index: 50;
        backdrop-filter: blur(2px);
    }

    /* 버튼 크기를 모바일에 맞게 압축 */
    .nav-btn {
        flex: 1; 
        background: #000;
        color: #fff;
        border: none;
        border-right: 1px solid #fff;
        padding: 12px 0; 
        font-family: 'NeoDunggeunmo', sans-serif;
        font-size: 16px; 
        cursor: pointer;
        transition: 0.2s;
        text-align: center;
    }
    .nav-btn:first-child {
        border-left: 1px solid #fff;
    }
    .nav-btn:hover, .nav-btn.active-tab {
        background: #fff;
        color: #000;
    }

    /* 우주 먼지 애니메이션 */
    .stars {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }
    .star {
        position: absolute;
        background-color: #fff;
        width: 2px;
        height: 2px;
        animation: drift infinite linear;
    }
    @keyframes drift {
        from { transform: translateY(100vh) translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        to { transform: translateY(-10vh) translateX(20px); opacity: 0; }
    }

    /* 페이지 컨테이너 */
    .page-container {
        position: relative;
        width: 100%;
        height: 100vh;
        padding-top: 60px;
        box-sizing: border-box;
    }

    /* 개별 페이지 공통 스타일 */
    .page {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        height: calc(100% - 60px);
        display: none; 
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        padding: 10px;
        box-sizing: border-box;
    }

    .page.active {
        display: flex;
        animation: glitchAppear 0.3s steps(3);
    }

    /* 레트로한 화면 전환 효과 */
    @keyframes glitchAppear {
        0% { opacity: 0; transform: scale(1.02); filter: invert(1); }
        50% { opacity: 0.5; transform: scale(0.98); filter: invert(0); }
        100% { opacity: 1; transform: scale(1); }
    }

    /* 2, 3페이지: UI 박스 */
    .retro-box {
        border: 2px solid #fff;
        background: #000;
        padding: 30px;
        width: 100%;
        max-width: 500px;
        box-shadow: 8px 8px 0px rgba(255, 255, 255, 0.2);
        text-align: center;
    }

    .retro-box h2 {
        margin-top: 0;
        border-bottom: 2px dashed #555;
        padding-bottom: 15px;
        letter-spacing: 2px;
    }

    /* 2페이지: 링크 버튼 (픽셀 스타일) */
    .link-group {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 25px;
    }

    .link-btn {
        display: block;
        padding: 15px;
        background: #000;
        color: #fff;
        text-decoration: none;
        border: 2px solid #fff;
        font-size: 16px;
        transition: 0.1s;
        text-transform: uppercase;
    }

    .link-btn:hover {
        background: #fff;
        color: #000;
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0px #555;
    }

    /* 3페이지: 명단 리스트 */
    .roster-list {
        list-style: none;
        padding: 0;
        margin: 20px 0 0 0;
        max-height: 40vh;
        overflow-y: auto;
        text-align: left;
        border: 1px solid #333;
        background: #0a0a0a;
    }

    .roster-list li {
        padding: 12px 15px;
        border-bottom: 1px dashed #333;
    }
    
    .roster-list li::before {
        content: "> ";
        color: #888;
    }

    /* 각진 레트로 스크롤바 */
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: #000; border-left: 1px solid #333; }
    ::-webkit-scrollbar-thumb { background: #fff; }
    
    /* --- 1페이지: 미연시 화면 스타일 --- */
    .vn-container {
        position: relative;
        width: 100%;
        max-width: 800px;
        height: 70vh; 
        max-height: 500px;
        border: 2px solid #fff;
        background: #111;
        box-shadow: 8px 8px 0px rgba(255, 255, 255, 0.2);
        cursor: pointer;
        overflow: hidden;
    }

    .vn-image {
        width: 100%;
        height: 100%;
        object-fit: cover; 
        display: block;
        opacity: 0.8;
    }

    /* 💡 대화창 높이 180px로 완전 고정 (덜렁거림 방지) */
    .dialogue-box {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        height: 180px; 
        padding: 20px 20px 40px 20px; 
        background: rgba(0, 0, 0, 0.85);
        border: 2px solid #fff;
        box-sizing: border-box;
        text-align: left;
        word-break: keep-all; 
    }

    .speaker-name {
        font-size: 22px;
        color: #fff;
        border-bottom: 2px dashed #555;
        padding-bottom: 5px;
        margin-bottom: 12px;
        display: inline-block;
        font-weight: bold;
    }

    .dialogue-text {
        font-size: 18px;
        line-height: 1.6;
        color: #ddd;
    }

    .click-indicator {
        position: absolute;
        right: 15px;
        bottom: 10px;
        font-size: 18px;
        animation: blink 1s infinite;
        display: none;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>

<div class="stars" id="star-container"></div>

<div class="navbar">
    <button class="nav-btn active-tab" onclick="goPage('page1', this)">[ VIDEO ]</button>
    <button class="nav-btn" onclick="goPage('page2', this)">[ JOIN ]</button>
    <button class="nav-btn" onclick="goPage('page3', this)">[ ROSTER ]</button>
</div>

<div class="page-container">
    <div id="page1" class="page active">
        <div class="vn-container" onclick="nextDialogue()">
            <img src="scene1.png" alt="캐릭터 일러스트" class="vn-image" id="bgImage">
            
            <div class="dialogue-box">
                <div class="speaker-name" id="speakerName">SYSTEM</div>
                <div class="dialogue-text" id="dialogueText">클릭하여 통신을 연결하십시오...</div>
                <div class="click-indicator" id="clickIndicator">▼</div>
            </div>
        </div>
    </div>

    <div id="page2" class="page">
        <div class="retro-box">
            <h2>SYSTEM.JOIN</h2>
            <p style="color: #ccc; font-size: 14px; line-height: 1.6; text-align: left;">
                > ACCESS GRANTED.<br>
                > 아래 링크를 통해 양식을 제출하십시오.
            </p>
            <div class="link-group">
                <a href="#" target="_blank" class="link-btn">구글 폼 제출</a>
                <a href="#" target="_blank" class="link-btn">문의하기 (Q&A)</a>
                <a href="#" target="_blank" class="link-btn">공식 계정 연결</a>
            </div>
        </div>
    </div>

    <div id="page3" class="page">
        <div class="retro-box">
            <h2>USER.ROSTER</h2>
            <ul class="roster-list">
                <li>PARTICIPANT_001</li>
                <li>PARTICIPANT_002</li>
                <li>PARTICIPANT_003</li>
                <li>PARTICIPANT_004</li>
            </ul>
        </div>
    </div>
</div>

<script>
    // 페이지 전환 함수
    function goPage(pageId, btnElement) {
        document.querySelectorAll('.page').forEach(page => {
            page.classList.remove('active');
        });
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('active-tab');
        });

        document.getElementById(pageId).classList.add('active');
        btnElement.classList.add('active-tab');
    }

    // 우주 먼지 흩뿌리기
    function createDust() {
        const container = document.getElementById('star-container');
        const dustCount = 60; 

        for (let i = 0; i < dustCount; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            let duration = Math.random() * 15 + 10; 
            star.style.animationDuration = duration + 's';
            star.style.animationDelay = Math.random() * -25 + 's';
            star.style.opacity = Math.random();
            container.appendChild(star);
        }
    }

    window.onload = createDust;
    
    // --- 대화창 제어 시스템 ---
    // 💡 대본에 image 속성을 추가하여 대사마다 배경을 바꿉니다.
    const scriptLines = [
        { name: "???", text: ". . . . . ."},
        { name: "???", text: ". . . . . .", image: "티티스_무표정.png" },
        { name: "???", text: "드디어 일어났구나? 기다리다 나까지 잠들 뻔했어.", image: "티티스_미소.png" },
        { name: "???", text: "그렇게 경계할 거 없어. 여긴 내 집이니까.", image: "티티스_미소.png" },
        { name: "???", text: "질질끌면 재미 없으니, 빠르게 설명하자구. 너도 많이 궁금할테니까.", image: "티티스_미소.png" },
        { name: "티티스", text: "나는 티티스. 앞으로 일어날 게임의 주최자야. 너를 게임에 참가시키기 위해 데려왔어.", image: "티티스_미소.png" },
        { name: "티티스", text: "온 세상의 나쁜 아이를 모아두고, 누가 더 나쁜 아이인지 겨루는 거야.", image: "티티스_미소.png" },
        { name: "티티스", text: "마지막까지 살아남으면, 과거로 돌아갈 기회를 줄거야. 네가 겪은 모든 것을 되바꿀 수 있도록.", image: "티티스_미소.png" },
        { name: "티티스", text: "강요하는 거 아니야. 다만... 이대로 죽기엔 아깝지 않아?", image: "티티스_미소.png" },
        { name: "티티스", text: "잘 생각해 봐. 기다릴게.", image: "티티스_미소.png" },
        { name: "티티스", text: ". . . . . .", image: "티티스_무표정.png" },
        { name: "티티스", text: ". . . . . ?", image: "티티스_불안.png" },
        { name: "티티스", text: "저기, 그렇게 계속 쳐다보면 좀 무섭거든? 나 할 말 끝났는데.", image: "티티스_당황.png" },
        { name: "티티스", text: "아, 어떻게 나가냐고?", image: "티티스_무표정.png" },
        { name: "티티스", text: "너 못 나가. 참가, 혹은 거절. 선택지는 두 개지만, 후자는 지옥에 떨어지기라서.", image: "티티스_미소.png" },
        { name: "티티스", text: "그야, 넌 그 세상에서 죽었잖아? 나는 네 영혼을 잠시 데리고 온거니까.", image: "티티스_미소.png" },
        { name: "티티스", text: "그러니 모쪼록, 잘 생각해 봐...", image: "티티스_미소.png" },
        { name: "SYSTEAM", text: "한 번 더 누르시면 처음으로 되돌아갑니다."}
    ];

    let currentLine = -1;
    let isTyping = false;
    let typingTimer;

    const typeSound = new Audio('titis_voice.wav');
    typeSound.volume = 0.5; 

    // 모바일 오디오 권한 잠금 해제 스위치
    let isAudioUnlocked = false; 

    function nextDialogue() {
        // 첫 터치 시 강제로 오디오 권한 해제
        if (!isAudioUnlocked) {
            typeSound.play().then(() => {
                typeSound.pause();
                typeSound.currentTime = 0;
            }).catch(e => {});
            isAudioUnlocked = true;
        }

        // 대사가 끝난 상태에서 클릭하면 처음으로 되돌아감
        if (currentLine >= scriptLines.length - 1 && !isTyping) {
            currentLine = -1; 
        }

        if (isTyping) {
            // 클릭 시 텍스트 즉시 출력
            clearInterval(typingTimer);
            isTyping = false;
            document.getElementById('dialogueText').textContent = scriptLines[currentLine].text;
            document.getElementById('clickIndicator').style.display = 'block';
        } else {
            // 다음 대사 시작
            currentLine++;
            const lineData = scriptLines[currentLine];
            
            // 💡 여기서 이미지가 갈아끼워집니다.
            if (lineData.image) {
                document.getElementById('bgImage').src = lineData.image;
            }

            document.getElementById('speakerName').textContent = lineData.name;
            document.getElementById('dialogueText').textContent = "";
            document.getElementById('clickIndicator').style.display = 'none';
            
            isTyping = true;
            let charIndex = 0;
            let currentText = ""; 
            
            typingTimer = setInterval(() => {
                currentText += lineData.text.charAt(charIndex); 
                document.getElementById('dialogueText').textContent = currentText; 
                
                // 공백이 아닐 때만 타격음 재생
                if (lineData.text.charAt(charIndex) !== " ") {
                    typeSound.currentTime = 0;
                    typeSound.play().catch(e => {});
                }
                
                charIndex++;
                
                if (charIndex >= lineData.text.length) {
                    clearInterval(typingTimer);
                    isTyping = false;
                    document.getElementById('clickIndicator').style.display = 'block';
                }
            }, 50); 
        }
    }
</script>
</body>
</html>
